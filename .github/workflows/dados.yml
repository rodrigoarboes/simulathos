name: Atualizar dados de mercado (academia)

# Roda todo dia às 09:00 UTC, busca as cotações mais recentes via
# tools/fetch-dados.mjs (Yahoo Finance + BCB SGS) para academia/data/,
# regenera o manifesto de procedência (academia/data/manifest.js) e
# abre commit direto na branch se algo mudou.
#
# O JOB FALHA — de vermelho, visível — quando:
#   · algum arquivo obrigatório não foi gerado;
#   · alguma pasta de séries encolheu (fonte caindo);
#   · sobrou arquivo gerado fora do commit;
#   · o dado JÁ COMMITADO está parado há mais de 7 dias.
#
# A regra dessa esteira é uma só: nada de `|| true`, nada de `2>/dev/null`,
# nada que deixe o robô terminar verde com dado velho. Ver o histórico do
# estrago em tools/checar-dados.mjs.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-dados:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar dados (academia)
        run: node tools/fetch-dados.mjs --target=academia

      - name: Conferir o que o fetch gerou
        run: node tools/checar-dados.mjs --modo=gerados

      - name: Commitar mudanças
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `git add -A <pasta>` em vez da lista de caminhos de antes: a lista
          # tinha um arquivo que nunca é gerado (imab-longo.json), e o git
          # aborta o add INTEIRO quando um pathspec não casa. Resultado: índice
          # vazio, "nada mudou" e nove dias de dado velho no ar.
          git add -A academia/data

          if git diff --cached --quiet; then
            echo "Nada mudou, sem commit."
            exit 0
          fi

          git commit -m "chore(dados): atualização diária automática (academia)"

          # Push com uma segunda tentativa: se alguém commitou na branch no meio
          # do caminho, reintegra e empurra de novo em vez de morrer.
          git push || {
            echo "push recusado — reintegrando a branch e tentando de novo"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }

      - name: Provar que o dado novo está commitado
        run: node tools/checar-dados.mjs --modo=commitado
